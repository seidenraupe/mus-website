name: Update Museum Schaffen events

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Eventfrog events (OrgID 5116588)
        env:
          EVENTFROG_API_KEY: ${{ secrets.EVENTFROG_API_KEY }}
        run: node scripts/fetch-mus-events.mjs
      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/mus_export.json; then
            echo "No changes to data/mus_export.json"
          else
            git add data/mus_export.json
            git commit -m "chore: update events from Eventfrog (OrgID 5116588)"
            git push
          fi
